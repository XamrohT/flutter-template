name: flutter_backoffice_template
description: "Template Flutter: counter app com Modular + MobX + Dio."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2
  mobx: ^2.2.0
  flutter_mobx: ^2.0.6+5
  flutter_modular: ^5.0.3
  get_it: ^7.2.0
  dio: ^5.2.1+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  intl_utils: ^2.8.5
  mobx_codegen: ^2.0.7
  build_runner: ^2.3.3
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

flutter_intl:
  enabled: true
  main_locale: pt_BR
